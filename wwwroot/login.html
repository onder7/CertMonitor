<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giriş - SSL Sertifika Durumu</title>
  <style>
    :root {
      --bg: #f3f4f6;
      --card: #ffffff;
      --text: #0e1d35;
      --muted: #6b7280;
      --line: #e5e7eb;
      --primary: #d9232e; /* Corendon Red */
      --primary-hover: #b81923;
      --danger: #dc2626;
      --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .box {
      width: min(400px, calc(100% - 32px));
      background: var(--card);
      padding: 36px 32px;
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
    }

    .header-accent {
      width: 40px;
      height: 4px;
      background: var(--primary);
      border-radius: 2px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin: 0 0 6px;
      color: var(--text);
    }

    p {
      color: var(--muted);
      margin: 0 0 24px;
    }

    label {
      display: block;
      margin: 16px 0 6px;
      font-weight: 600;
      font-size: 13px;
      color: #374151;
    }

    input {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font: inherit;
      transition: all 0.2s ease;
      outline: none;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(217, 35, 46, 0.15);
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 24px;
      background: var(--primary);
      border: none;
      border-radius: 8px;
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    button:hover {
      background: var(--primary-hover);
    }

    .error {
      color: var(--danger);
      min-height: 20px;
      margin-top: 14px;
      font-size: 13px;
      text-align: center;
    }

    .footer {
      position: fixed;
      bottom: 24px;
      left: 0;
      right: 0;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    .footer a {
      color: var(--text);
      font-weight: 600;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .footer a:hover {
      color: var(--primary);
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <form class="box" id="form">
    <div class="header-accent"></div>
    <h1>SSL Sertifika Durumu</h1>
    <p>Devam etmek için giriş yapın.</p>

    <label for="user">Kullanıcı adı</label>
    <input id="user" autocomplete="username" required>

    <label for="pass">Parola</label>
    <input id="pass" type="password" autocomplete="current-password" required>

    <button type="submit">Giriş yap</button>
    <div class="error" id="error"></div>
  </form>

  <script>
    form.onsubmit = async e => {
      e.preventDefault();
      error.textContent = '';
      try {
        const r = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userName: user.value, password: pass.value })
        });
        if (r.ok) location.href = '/';
        else if (r.status === 401) error.textContent = 'Kullanıcı adı veya parola hatalı.';
        else if (r.status >= 500) error.textContent = 'Sunucu hatası. Lütfen daha sonra tekrar deneyin.';
        else error.textContent = 'Giriş yapılamadı. Lütfen tekrar deneyin.';
      } catch (e) {
        error.textContent = 'Sunucuya bağlanılamıyor. İnternet bağlantınızı kontrol edin.';
      }
    }
  </script>

  <div class="footer">
     &bull; Önder AKÖZ &bull; 

</body>
</html>
